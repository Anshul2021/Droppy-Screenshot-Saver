<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Droppy — Screenshot Inbox</title>
  <style>
    :root {
      --figma-bg: #ffffff;
      --figma-text: #1e1e1e;
      --figma-text-secondary: #757575;
      --figma-border: #e6e6e6;
      --figma-border-subtle: #f5f5f5;
      --figma-blue: #18a0fb;
      --figma-blue-hover: #0d8de3;
      --figma-danger: #f24822;
      --figma-danger-bg: #fff5f5;
      --figma-card-bg: #fafafa;
      --font-stack: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-stack);
      font-size: 12px;
      color: var(--figma-text);
      background-color: var(--figma-bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .plugin-header {
      padding: 10px 14px 8px 14px;
      border-bottom: 1px solid var(--figma-border);
      background-color: var(--figma-bg);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .plugin-logo {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      object-fit: cover;
    }

    .plugin-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--figma-text);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      color: #10b981;
      background: #ecfdf5;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
      display: inline-block;
    }

    .status-dot.offline {
      background-color: var(--figma-danger);
    }

    .live-badge.offline {
      color: var(--figma-danger);
      background: #fef2f2;
    }

    .btn-icon-refresh {
      background: none;
      border: none;
      color: var(--figma-text-secondary);
      font-size: 13px;
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 4px;
      line-height: 1;
    }

    .btn-icon-refresh:hover {
      color: var(--figma-text);
      background-color: var(--figma-border-subtle);
    }

    .count-badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--figma-text-secondary);
    }

    /* Section Target Configuration */
    .section-config {
      padding: 8px 14px;
      background-color: #fbfbfb;
      border-bottom: 1px solid var(--figma-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--figma-text-secondary);
    }

    .section-inputs {
      display: flex;
      gap: 6px;
    }

    .select-dropdown {
      flex: 1;
      height: 28px;
      font-size: 11px;
      font-family: inherit;
      color: var(--figma-text);
      background-color: #ffffff;
      border: 1px solid var(--figma-border);
      border-radius: 4px;
      padding: 0 6px;
      outline: none;
    }

    .select-dropdown:focus {
      border-color: var(--figma-blue);
    }

    .section-name-input {
      flex: 1;
      height: 28px;
      font-size: 11px;
      font-family: inherit;
      color: var(--figma-text);
      background-color: #ffffff;
      border: 1px solid var(--figma-border);
      border-radius: 4px;
      padding: 0 8px;
      outline: none;
    }

    .section-name-input:focus {
      border-color: var(--figma-blue);
    }

    /* Error Banner */
    .error-banner {
      background-color: var(--figma-danger-bg);
      border: 1px solid #fed7d7;
      color: var(--figma-danger);
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 4px;
      margin: 8px 12px 0 12px;
      flex-shrink: 0;
      line-height: 1.4;
    }

    /* Content / List */
    .plugin-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--figma-text-secondary);
      font-size: 12px;
      padding: 32px 16px;
      line-height: 1.5;
    }

    .empty-icon {
      font-size: 24px;
      margin-bottom: 6px;
      display: block;
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Screenshot Card */
    .item-card {
      background: var(--figma-card-bg);
      border: 1px solid var(--figma-border);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-thumb-wrap {
      width: 44px;
      height: 44px;
      background-color: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--figma-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-size: 10px;
      color: var(--figma-text-secondary);
      margin-top: 2px;
    }

    .item-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    /* Buttons */
    .btn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      border-radius: 4px;
      padding: 5px 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-action-insert {
      background-color: var(--figma-blue);
      color: #ffffff;
    }

    .btn-action-insert:hover:not(:disabled) {
      background-color: var(--figma-blue-hover);
    }

    .btn-action-delete {
      background-color: transparent;
      color: var(--figma-text-secondary);
      border-color: var(--figma-border);
    }

    .btn-action-delete:hover:not(:disabled) {
      color: var(--figma-danger);
      border-color: #fed7d7;
      background-color: var(--figma-danger-bg);
    }

    /* Footer */
    .plugin-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--figma-border);
      background-color: var(--figma-bg);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-footer-primary {
      flex: 1;
      background-color: var(--figma-blue);
      color: #ffffff;
      height: 34px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-footer-primary:hover:not(:disabled) {
      background-color: var(--figma-blue-hover);
    }

    /* Progress Overlay */
    .progress-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
    }

    .progress-box {
      width: 100%;
      max-width: 280px;
      background: #ffffff;
      border: 1px solid var(--figma-border);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .progress-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .progress-status {
      font-size: 11px;
      color: var(--figma-text-secondary);
      margin-bottom: 12px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--figma-blue);
      transition: width 0.2s ease;
    }

    /* Skeleton Loading State */
    .skeleton-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skeleton-card {
      background: var(--figma-card-bg);
      border: 1px solid var(--figma-border);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .skeleton-thumb {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      background-color: #e5e7eb;
      flex-shrink: 0;
    }

    .skeleton-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .skeleton-line {
      height: 10px;
      border-radius: 3px;
      background-color: #e5e7eb;
    }

    .line-title {
      width: 70%;
      height: 12px;
    }

    .line-subtitle {
      width: 45%;
    }

    .shimmer {
      background: linear-gradient(
        90deg,
        #e5e7eb 0%,
        #f3f4f6 50%,
        #e5e7eb 100%
      );
      background-size: 200% 100%;
      animation: figmaShimmer 1.4s infinite linear;
    }

    @keyframes figmaShimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="plugin-header">
    <div class="header-top">
      <div class="brand-row">
        <img src="logo.png" alt="Droppy" class="plugin-logo">
        <span class="plugin-title">Droppy</span>
      </div>
      <div class="header-controls">
        <div class="live-badge" id="liveBadge">
          <span class="status-dot" id="statusDot"></span>
          <span>LIVE</span>
        </div>
        <button type="button" class="btn-icon-refresh" id="refreshBtn" title="Refresh">↻</button>
      </div>
    </div>
    <div class="count-badge" id="countBadge">Checking server...</div>
  </header>

  <!-- Section Organization Bar -->
  <div class="section-config" id="sectionConfig">
    <div class="section-label">Organize into Section</div>
    <div class="section-inputs">
      <select id="sectionTargetSelect" class="select-dropdown">
        <option value="new">➕ Create New Section</option>
        <option value="none">Canvas (No Section)</option>
      </select>
      <input type="text" id="sectionNameInput" class="section-name-input" placeholder="Section name..." value="Mobile Screenshots">
    </div>
  </div>

  <!-- Error Banner -->
  <div id="errorBanner" class="error-banner hidden"></div>

  <!-- Content List -->
  <main class="plugin-body">
    <!-- Skeleton Loaders -->
    <div id="skeletonContainer" class="skeleton-list">
      <div class="skeleton-card">
        <div class="skeleton-thumb shimmer"></div>
        <div class="skeleton-info">
          <div class="skeleton-line line-title shimmer"></div>
          <div class="skeleton-line line-subtitle shimmer"></div>
        </div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-thumb shimmer"></div>
        <div class="skeleton-info">
          <div class="skeleton-line line-title shimmer"></div>
          <div class="skeleton-line line-subtitle shimmer"></div>
        </div>
      </div>
    </div>

    <div id="emptyState" class="empty-state hidden">
      <span class="empty-icon">📥</span>
      <strong>No screenshots waiting</strong>
      <div style="font-size: 11px; margin-top: 4px;">Upload from your phone or browser to see them pop up live!</div>
    </div>

    <div id="queueList" class="queue-list"></div>
  </main>

  <!-- Footer Actions -->
  <footer class="plugin-footer hidden" id="actionFooter">
    <button type="button" class="btn btn-footer-primary" id="insertAllBtn">Insert All to Canvas</button>
  </footer>

  <!-- Progress Modal for Batch Insert -->
  <div id="progressModal" class="progress-overlay hidden">
    <div class="progress-box">
      <div class="progress-title" id="progressTitle">Importing Screenshots</div>
      <div class="progress-status" id="progressStatus">Preparing images...</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>
  </div>

  <script src="ui.js"></script>
  <script>
    // Embedded inline execution fallback for Figma sandbox if external script is unbundled
    if (typeof fetchScreenshots === 'undefined' && typeof window.__droppy_initialized === 'undefined') {
      window.__droppy_initialized = true;
      const SERVER_BASE = 'http://localhost:3847';
      const MAX_FIGMA_DIMENSION = 4096;

      const statusDot = document.getElementById('statusDot');
      const liveBadge = document.getElementById('liveBadge');
      const countBadge = document.getElementById('countBadge');
      const errorBanner = document.getElementById('errorBanner');
      const skeletonContainer = document.getElementById('skeletonContainer');
      const queueList = document.getElementById('queueList');
      const emptyState = document.getElementById('emptyState');
      const actionFooter = document.getElementById('actionFooter');
      const insertAllBtn = document.getElementById('insertAllBtn');
      const refreshBtn = document.getElementById('refreshBtn');

      const sectionTargetSelect = document.getElementById('sectionTargetSelect');
      const sectionNameInput = document.getElementById('sectionNameInput');

      const progressModal = document.getElementById('progressModal');
      const progressStatus = document.getElementById('progressStatus');
      const progressBarFill = document.getElementById('progressBarFill');

      let cachedScreenshots = [];
      let lastKnownJson = '';
      let isBusy = false;
      let existingSections = [];

      function showError(msg) {
        if (!errorBanner) return;
        errorBanner.textContent = msg;
        errorBanner.classList.remove('hidden');
      }

      function hideError() {
        if (!errorBanner) return;
        errorBanner.classList.add('hidden');
      }

      function setOnline(online) {
        if (statusDot) {
          if (online) {
            statusDot.classList.remove('offline');
            if (liveBadge) liveBadge.classList.remove('offline');
          } else {
            statusDot.classList.add('offline');
            if (liveBadge) liveBadge.classList.add('offline');
          }
        }
      }

      function formatRelativeTime(timestamp) {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        const pad = (n) => String(n).padStart(2, '0');
        return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
      }

      function showProgress(status, percent) {
        if (!progressModal) return;
        progressModal.classList.remove('hidden');
        progressStatus.textContent = status;
        progressBarFill.style.width = `${Math.min(100, Math.max(0, percent))}%`;
      }

      function hideProgress() {
        if (!progressModal) return;
        progressModal.classList.add('hidden');
        progressBarFill.style.width = '0%';
      }

      function updateSectionsDropdown(sections) {
        existingSections = sections || [];
        const currentVal = sectionTargetSelect.value;
        sectionTargetSelect.innerHTML = '';

        const optNew = document.createElement('option');
        optNew.value = 'new';
        optNew.textContent = '➕ Create New Section';
        sectionTargetSelect.appendChild(optNew);

        if (existingSections.length > 0) {
          const optGroup = document.createElement('optgroup');
          optGroup.label = 'Existing Sections';
          existingSections.forEach((s) => {
            const opt = document.createElement('option');
            opt.value = `existing:${s.id}`;
            opt.textContent = `📁 ${s.name}`;
            optGroup.appendChild(opt);
          });
          sectionTargetSelect.appendChild(optGroup);
        }

        const optNone = document.createElement('option');
        optNone.value = 'none';
        optNone.textContent = 'Canvas (No Section)';
        sectionTargetSelect.appendChild(optNone);

        if (currentVal && Array.from(sectionTargetSelect.options).some(o => o.value === currentVal)) {
          sectionTargetSelect.value = currentVal;
        }

        handleSectionSelectChange();
      }

      function handleSectionSelectChange() {
        const val = sectionTargetSelect.value;
        if (val === 'new') {
          sectionNameInput.classList.remove('hidden');
        } else {
          sectionNameInput.classList.add('hidden');
        }
      }

      sectionTargetSelect.addEventListener('change', handleSectionSelectChange);

      async function prepareImageBytes(blob, initialWidth, initialHeight) {
        return new Promise((resolve, reject) => {
          if (initialWidth && initialHeight && initialWidth <= MAX_FIGMA_DIMENSION && initialHeight <= MAX_FIGMA_DIMENSION) {
            const reader = new FileReader();
            reader.onload = () => {
              resolve({
                bytes: Array.from(new Uint8Array(reader.result)),
                width: initialWidth,
                height: initialHeight
              });
            };
            reader.onerror = () => reject(new Error('Failed to read image buffer'));
            reader.readAsArrayBuffer(blob);
            return;
          }

          const img = new Image();
          const url = URL.createObjectURL(blob);
          img.onload = () => {
            URL.revokeObjectURL(url);
            let width = img.naturalWidth || initialWidth || 800;
            let height = img.naturalHeight || initialHeight || 600;

            if (width > MAX_FIGMA_DIMENSION || height > MAX_FIGMA_DIMENSION) {
              const scale = Math.min(MAX_FIGMA_DIMENSION / width, MAX_FIGMA_DIMENSION / height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((resizedBlob) => {
              if (!resizedBlob) return reject(new Error('Canvas export failed'));
              const reader = new FileReader();
              reader.onload = () => {
                resolve({
                  bytes: Array.from(new Uint8Array(reader.result)),
                  width,
                  height
                });
              };
              reader.onerror = () => reject(new Error('Failed to read resized image'));
              reader.readAsArrayBuffer(resizedBlob);
            }, 'image/png');
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('Failed to decode image'));
          };
          img.src = url;
        });
      }

      async function fetchImageForPlugin(item) {
        const imageUrl = item.url.startsWith('http') ? item.url : `${SERVER_BASE}${item.url}`;
        const res = await fetch(imageUrl);
        if (!res.ok) throw new Error(`Failed to fetch image ${item.filename} (HTTP ${res.status})`);
        const blob = await res.blob();
        const prepared = await prepareImageBytes(blob, item.width, item.height);
        return {
          bytes: prepared.bytes,
          width: prepared.width,
          height: prepared.height,
          filename: item.filename
        };
      }

      function getSectionParams() {
        const val = sectionTargetSelect.value;
        if (val.startsWith('existing:')) {
          return {
            sectionOption: 'existing',
            targetSectionId: val.replace('existing:', ''),
            sectionName: ''
          };
        }
        if (val === 'none') {
          return {
            sectionOption: 'none',
            targetSectionId: null,
            sectionName: ''
          };
        }
        return {
          sectionOption: 'new',
          targetSectionId: null,
          sectionName: sectionNameInput.value.trim() || 'Mobile Screenshots'
        };
      }

      async function handleInsertItem(item, buttonEl) {
        if (isBusy) return;
        isBusy = true;
        hideError();
        const originalText = buttonEl ? buttonEl.textContent : 'Insert';
        if (buttonEl) {
          buttonEl.textContent = 'Inserting...';
          buttonEl.disabled = true;
        }

        try {
          const payload = await fetchImageForPlugin(item);
          const sectionParams = getSectionParams();

          parent.postMessage({
            pluginMessage: {
              type: 'insert',
              bytes: payload.bytes,
              width: payload.width,
              height: payload.height,
              filename: item.filename,
              ...sectionParams
            }
          }, '*');
        } catch (err) {
          console.error('[Droppy Plugin] Single insert error:', err);
          showError('Failed to insert screenshot. Check connection.');
        } finally {
          if (buttonEl) {
            buttonEl.textContent = originalText;
            buttonEl.disabled = false;
          }
          isBusy = false;
        }
      }

      async function handleInsertAll() {
        if (isBusy || cachedScreenshots.length === 0) return;
        isBusy = true;
        hideError();
        insertAllBtn.disabled = true;

        const total = cachedScreenshots.length;
        showProgress(`Preparing 1 of ${total} screenshots...`, 10);

        const payloads = [];
        for (let i = 0; i < total; i++) {
          const item = cachedScreenshots[i];
          try {
            showProgress(`Downloading ${i + 1} of ${total}: ${item.filename}`, Math.round(((i + 1) / total) * 80));
            const payload = await fetchImageForPlugin(item);
            payloads.push(payload);
          } catch (err) {
            console.error('[Droppy Plugin] Error fetching item for Insert All:', item.filename, err);
          }
        }

        if (payloads.length > 0) {
          showProgress(`Placing ${payloads.length} screenshots into Figma...`, 95);
          const sectionParams = getSectionParams();

          parent.postMessage({
            pluginMessage: {
              type: 'insert-all',
              items: payloads,
              ...sectionParams
            }
          }, '*');
        } else {
          showError('Failed to download screenshots for insertion.');
          hideProgress();
          insertAllBtn.disabled = false;
          isBusy = false;
        }
      }

      async function handleDeleteItem(filename) {
        hideError();
        try {
          const res = await fetch(`${SERVER_BASE}/screenshots/${encodeURIComponent(filename)}`, {
            method: 'DELETE'
          });
          if (!res.ok) throw new Error(`Failed to delete (${res.status})`);
          fetchScreenshots();
        } catch (err) {
          console.error('[Droppy Plugin] Delete error:', err);
          showError('Failed to delete screenshot.');
        }
      }

      function renderScreenshots(items) {
        if (skeletonContainer) skeletonContainer.classList.add('hidden');
        cachedScreenshots = items || [];
        const count = cachedScreenshots.length;
        countBadge.textContent = count === 0 ? 'No screenshots waiting' : `${count} screenshot${count === 1 ? '' : 's'} waiting`;

        if (count === 0) {
          emptyState.classList.remove('hidden');
          queueList.innerHTML = '';
          actionFooter.classList.add('hidden');
          return;
        }

        emptyState.classList.add('hidden');
        actionFooter.classList.remove('hidden');

        const fragment = document.createDocumentFragment();
        cachedScreenshots.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'item-card';

          const thumbWrap = document.createElement('div');
          thumbWrap.className = 'item-thumb-wrap';
          const img = document.createElement('img');
          img.className = 'item-thumb';
          img.src = item.url.startsWith('http') ? item.url : `${SERVER_BASE}${item.url}`;
          img.alt = item.filename;
          img.loading = 'lazy';
          thumbWrap.appendChild(img);

          const info = document.createElement('div');
          info.className = 'item-info';
          const name = document.createElement('div');
          name.className = 'item-name';
          name.textContent = item.filename;

          const meta = document.createElement('div');
          meta.className = 'item-meta';
          const dimsStr = item.width && item.height ? `${item.width} × ${item.height}` : 'Image';
          const timeStr = formatRelativeTime(item.createdAt);
          meta.textContent = timeStr ? `${dimsStr} • ${timeStr}` : dimsStr;

          info.appendChild(name);
          info.appendChild(meta);

          const actions = document.createElement('div');
          actions.className = 'item-actions';

          const insertBtn = document.createElement('button');
          insertBtn.type = 'button';
          insertBtn.className = 'btn btn-action-insert';
          insertBtn.textContent = 'Insert';
          insertBtn.addEventListener('click', () => handleInsertItem(item, insertBtn));

          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.className = 'btn btn-action-delete';
          deleteBtn.textContent = 'Delete';
          deleteBtn.addEventListener('click', () => handleDeleteItem(item.filename));

          actions.appendChild(insertBtn);
          actions.appendChild(deleteBtn);

          card.appendChild(thumbWrap);
          card.appendChild(info);
          card.appendChild(actions);

          fragment.appendChild(card);
        });

        queueList.innerHTML = '';
        queueList.appendChild(fragment);
      }

      async function fetchScreenshots() {
        try {
          const res = await fetch(`${SERVER_BASE}/screenshots`);
          if (!res.ok) throw new Error(`Server status ${res.status}`);
          const data = await res.json();
          setOnline(true);
          hideError();

          const jsonStr = JSON.stringify(data);
          if (jsonStr !== lastKnownJson) {
            lastKnownJson = jsonStr;
            renderScreenshots(data);
          }
        } catch (err) {
          console.error('[Droppy Plugin] Connection error:', err);
          if (skeletonContainer) skeletonContainer.classList.add('hidden');
          setOnline(false);
          countBadge.textContent = 'Offline';
          showError("Can't connect to server — ensure Node server is running on port 3847");
        }
      }

      window.onmessage = (event) => {
        const msg = event.data && event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === 'sections-list') {
          updateSectionsDropdown(msg.sections);
        }

        if (msg.type === 'insert-complete' || msg.type === 'insert-all-complete') {
          hideProgress();
          insertAllBtn.disabled = false;
          isBusy = false;
          fetchScreenshots();
        }
      };

      insertAllBtn.addEventListener('click', handleInsertAll);
      refreshBtn.addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type: 'get-sections' } }, '*');
        fetchScreenshots();
      });

      // Initial query & live polling every 1.5s
      parent.postMessage({ pluginMessage: { type: 'get-sections' } }, '*');
      fetchScreenshots();
      setInterval(fetchScreenshots, 1500);
    }
  </script>
</body>
</html>
